---
layout: default
---
<article class="post">
  <a class="crumb" href="{{ '/updates/' | relative_url }}">← All updates</a>
  <header class="page-head">
    <div class="kicker mono">{{ page.date | date: '%B %Y' }}{% if page.kind %} · {{ page.kind }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede-lg">{{ page.summary }}</p>{% endif %}
    {% if page.links %}
    <div class="chips">
      {% for l in page.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="prose">
{{ content }}
  </div>
</article>
