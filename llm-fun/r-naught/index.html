</mtext>`,Q=(...e)=>`<mrow>${e.join("")}</mrow>`,He=(e,t)=>`<mfrac>${Q(e)}${Q(t)}</mfrac>`,le=(e,t)=>`<msub>${Q(e)}${Q(t)}</msub>`,Ct=(e,t)=>`<msup>${Q(e)}${Q(t)}</msup>`,jo=(e,t,a)=>`<msubsup>${Q(e)}${Q(t)}${Q(a)}</msubsup>`,ee=(...e)=>Q('<mo lspace="0" rspace="0">(</mo>',...e,'<mo lspace="0" rspace="0">)</mo>'),ze=(...e)=>`<div class="eq"><math display="block">${e.length>1?`<mtable>${e.map(t=>`<mtr><mtd>${t}</mtd></mtr>`).join("")}</mtable>`:e[0]}</math></div>`,m=(...e)=>`<math>${e.join("")}</math>`;var Lt=e=>`<div class="fig" data-fig="${e}"></div>`,yn=(e,t)=>`<div class="callout"><strong>${e}</strong> ${t}</div>`,ye=d("\u03B2"),qe=d("\u03B3"),Pe=d("\u03BC"),We=d("S"),we=d("I"),at=d("R"),mn=d("D"),Ie=d("N"),he='<mo lspace="0" rspace="0">/</mo>',V=U("="),ue=U("+"),ne=U("\u2212"),fa=U("\xD7"),ge=le(d("R"),C("0")),Gt=le(d("R"),d("t")),bn=Q(qe,ue,Pe),Je=ee(qe,ue,Pe),Dt=e=>He(Q(d("d"),e),Q(d("d"),d("t"))),Mt=(...e)=>Ct(d("e"),Q(...e)),pe=e=>le(e,d("i")),gn=e=>le(e,d("j")),Fl=[{id:"curious",label:"Curious",blurb:"Plain words and pictures, no equations. Start here if you have never met an epidemic model."},{id:"student",label:"Student",blurb:"The SIRD equations, R0 and the main results, each derived and read in words, with a worked example."},{id:"researcher",label:"Researcher",blurb:"The model exactly as implemented: discrete-time chain-binomial metapopulation, observation model, social layer and limitations."}],Ps=[],Zt=(e,t,a,n,o)=>Ps.push({id:e,title:t,levels:{curious:a,student:n,researcher:o}});Zt("what-is-a-model","What is an epidemic model?",`<p>An epidemic model is a simplified description of how an infection moves through a population. It sorts people into a few groups and uses rules to say how many people move between groups each day.</p>
<p>The infection is caused by a <strong>pathogen</strong>, a virus or bacterium that passes between people. A model leaves out most details on purpose, so we can see which parts matter and safely ask "what if".</p>
<p>This game is built on a family of models that scientists have used for about a century. It is good for building intuition. Its numbers are not predictions about any real disease.</p>`,`<p>A <strong>compartmental model</strong> divides a population into groups, called compartments, by infection status, and writes equations for the rates at which people move between them. Rates are per day throughout this page.</p>
<p>The founding version was published by Kermack and McKendrick in 1927. Its simplest form treats the population as large and well mixed, so everyone is equally likely to meet everyone else, and the model becomes a set of ordinary differential equations for average behavior.</p>
<p>The game adds three things. It counts whole people and draws random numbers each day. It runs one copy of the model for each of 171 countries, linked by travel. And player decisions and social forces change the model's parameters. It is a teaching game built on a real model family, and it is not calibrated for forecasting.</p>`,`<p>The game is a stochastic metapopulation SIRD model in real units (days, integer people), with 171 patches (countries with at least 100,000 people), a discrete daily time step, a mobility coupling built from gravity-model flows, an explicit observation process and a phenomenological social-dynamics layer that feeds back on transmission, compliance, mobility, capacity and reporting. Every game mechanic acts by modifying a named model parameter. No mechanic adds or removes infections directly.</p>
<p>The engine is pure and deterministic given the configuration (including the seed), the world data and the sequence of player actions. All randomness comes from a seeded generator held in the saved state.</p>
<p>The epidemiological parameters are chosen inside standard literature ranges. The game-economy and social parameters were tuned for play with headless AI-versus-AI simulation. Nothing here is fitted to surveillance data, and the model is not a forecasting tool. Its value is that the mechanisms are explicit and inspectable, so players can see why an intervention helps or fails.</p>`);Zt("compartments","Compartments: S, I, R and D",`<p>Every person is in one of four groups, called compartments.</p>
<ul>
<li><strong>S, susceptible.</strong> People who can catch the infection.</li>
<li><strong>I, infected.</strong> People who are infected now and can pass it on.</li>
<li><strong>R, recovered.</strong> People who have recovered and are immune. Vaccinated people count here too.</li>
<li><strong>D, dead.</strong> People who died of the infection.</li>
</ul>
<p>Each day some susceptible people catch the infection, and some infected people recover or die. People only move between groups, so nobody is lost from the count.</p>
${Lt("compartments")}
<p>The dashed arrows are extra rules. Vaccination moves people straight from S to R. With the optional "waning immunity" setting, immune people slowly return to S.</p>`,`<p>The SIRD model has four compartments: susceptible <span class="sym">S</span>, infected and infectious <span class="sym">I</span>, recovered and immune <span class="sym">R</span>, and dead <span class="sym">D</span>. The living population is ${m(Ie,V,We,ue,we,ue,at)}. In its continuous, deterministic form the model reads</p>
${ze(Q(Dt(We),V,ne,ye,He(Q(We,we),Ie)),Q(Dt(we),V,ye,He(Q(We,we),Ie),ne,Je,we),Q(Dt(at),V,qe,we,U(","),Yn(),Dt(mn),V,Pe,we))}
<p>Each term in words:</p>
<ul>
<li>${m(ye)} is the <strong>transmission rate</strong>, per day. An infected person has contacts that would pass on the infection at rate ${m(ye)}, if the other person were susceptible. Only a fraction ${m(We,he,Ie)} of contacts are with susceptible people, so the population gains ${m(ye,We,we,he,Ie)} new infections per day. This is the <strong>force of infection</strong> ${m(d("\u03BB"),V,ye,we,he,Ie)} (the rate at which each susceptible person is infected) times ${m(We)}.</li>
<li>${m(qe)} is the <strong>recovery rate</strong> and ${m(Pe)} the <strong>disease death rate</strong>, both per day. Infected people leave ${m(we)} at total rate ${m(bn)}, so the mean infectious period is ${m(C("1"),he,Je)} days.</li>
<li>Of the people who leave ${m(we)}, a fraction ${m(Pe,he,Je)} die and the rest recover.</li>
</ul>
<p>Adding the four equations gives zero. People are moved between compartments and never created or lost.</p>
${Lt("compartments")}
<p>The diagram also shows two optional flows. Vaccination moves people from ${m(We)} to ${m(at)}. With waning immunity switched on, people return from ${m(at)} to ${m(We)} at rate ${m(d("\u03C9"))} (one per year on average in the game).</p>`,`<p>Per country ${m(d("i"))} the state is the integer vector ${m(ee(pe(We),U(","),pe(we),U(","),pe(at),U(","),pe(mn)))}, plus conflict deaths and net displaced people from the social layer, with ${m(pe(Ie),V,pe(We),ue,pe(we),ue,pe(at))} the living population. Population is conserved exactly: ${m(pe(We),ue,pe(we),ue,pe(at),ue,pe(mn),ue,re("conflict deaths"),ne,re("net migrants"),V,le(d("N"),Q(d("i"),U(","),C("0"))))}, and migration sums to zero over the world.</p>
<p>The deterministic skeleton, used by the engine's helper functions and the explorer's readouts, is</p>
${ze(Q(Dt(We),V,ne,d("\u03BB"),We,ue,d("\u03C9"),at,ne,d("v"),ee(d("t"))),Q(Dt(we),V,d("\u03BB"),We,ne,Je,we),Q(Dt(at),V,qe,we,ne,d("\u03C9"),at,ue,d("v"),ee(d("t")),U(","),Yn(),Dt(mn),V,Pe,we))}
<p>with ${m(d("\u03BB"),V,ye,we,he,Ie)}, ${m(d("\u03C9"))} the waning rate (0 unless the waning toggle is on, then 1/${de(1/oe("waningRate"))} per day) and ${m(d("v"),ee(d("t")))} the flow of successful immunizations. Recovery and death are competing exponential risks with constant hazards ${m(qe)} and ${m(Pe)}, so the time in ${m(we)} is exponential with mean ${m(C("1"),he,Je)} and the infection-fatality ratio is ${m(re("IFR"),V,Pe,he,Je)}. There is no latent (exposed) class: an infection is infectious from the day after it is acquired.</p>
${Lt("compartments")}
<p>The pathogen's base profile fixes ${m(le(at,re("ref")))} and a mean infectious period ${m(le(mn,C("0")))} for a reference country, giving ${m(bn,V,C("1"),he,le(mn,C("0")))}, ${m(Pe,V,re("IFR"),U("\xB7"),Je)} and ${m(ye,V,le(at,re("ref")),he,le(mn,C("0")))}. Traits and country factors then modify these, as described below.</p>`);Zt("r0","R0 and the epidemic threshold",`<p>The <strong>basic reproduction number</strong>, written R0 and read "R naught", is the average number of people one infected person infects when nobody is immune yet. It is infections per day multiplied by days infectious. Half an infection a day for five days gives 2.5.</p>
<p>R0 = 1 is the tipping point. Below 1, each generation of cases is smaller than the last and the outbreak fades. Above 1, cases grow, at first like compound interest.</p>
${Lt("r0-threshold")}
<p>The chart shows the share ever infected for each R0. It is zero below 1 and climbs steeply above it.</p>
<p>R0 depends on the setting and on behavior as well as on the pathogen. Once some people are immune or behave differently, the current figure is called the <strong>effective reproduction number</strong>, written R<em>t</em>. Control means pushing it below 1.</p>`,`<p>The <strong>basic reproduction number</strong> ${m(ge)} is the expected number of people infected by one typical case in a fully susceptible population. It is a rate times a duration. When almost everyone is susceptible, one case causes ${m(ye)} infections per day, for ${m(C("1"),he,Je)} days on average:</p>
${ze(Q(ge,V,ye,fa,He(C("1"),bn),V,He(ye,bn)))}
<p>In words: infections per day, times days infectious.</p>
<p>Factoring ${m(Je,we)} out of the ${m(we)} equation gives the threshold:</p>
${ze(Q(Dt(we),V,Je,we,ee(ge,He(We,Ie),ne,C("1"))))}
<p>In words: the number infected grows when ${m(ge,We,he,Ie,U("&gt;"),C("1"))} and shrinks when it is below 1. The quantity ${m(Gt,V,ge,We,he,Ie)} is the <strong>effective reproduction number</strong>, the average number of new infections per case given how many people are still susceptible. If ${m(ge,U("&lt;"),C("1"))} an introduction dies out. If ${m(ge,U("&gt;"),C("1"))} it can grow until ${m(We)} has fallen enough to bring ${m(Gt)} down to 1.</p>
${Lt("r0-threshold")}
<p>The chart shows the final share ever infected against ${m(ge)}. Lowering ${m(ye)} or shortening the infectious period lowers ${m(Gt)} just as immunity does. Published ${m(ge)} values are ranges, because they depend on the population and setting.</p>`,`<p>For one well-mixed patch, ${m(ge,V,ye,he,Je)}, the force of infection of one infective in a susceptible population integrated over the exponential sojourn in ${m(we)}. Linearizing at the disease-free state gives ${m(Dt(we),U("\u2248"),Je,ee(ge,ne,C("1")),we)}, and ${m(Gt,V,ge,We,he,Ie)}.</p>
<h3>Frequency versus density dependence</h3>
<p>The engine uses ${m(d("\u03BB"),V,ye,we,he,Ie)}, so ${m(ge)} is independent of ${m(Ie)}. Under density dependence, ${m(d("\u03BB"),V,Ct(ye,U("\u2032")),we)}, ${m(ge,V,Ct(ye,U("\u2032")),Ie,he,Je)} and there is a critical population size for invasion. Density enters the game only as a weak covariate, ${m(ye,fa,ee(C("1"),ue,se(oe("densityBeta")),ee(re("density"),ne,C("0.5"))))}, with density a 0 to 1 log-scaled index, alongside an urban covariate ${m(ee(C("1"),ue,se(oe("urbanBeta")),ee(re("urban"),ne,C("0.5"))))}.</p>
<h3>The daily scheme and the person-time factor</h3>
<p>An infection acquired on day ${m(d("t"))} enters ${m(we)} at the end of that day and survives each later day with probability ${m(Mt(ne,d("k")))}, ${m(d("k"),V,bn)}. Its infectious days are geometric with mean ${m(C("1"),he,ee(C("1"),ne,Mt(ne,d("k"))))}, so a naive chain with hazard ${m(C("1"),ne,Mt(ne,ye,we,he,Ie))} would have reproduction number</p>
${ze(Q(le(at,d("d")),V,He(ye,Q(C("1"),ne,Mt(ne,d("k")))),V,He(ge,d("\u03C6")),U(","),Yn(),d("\u03C6"),V,He(Q(C("1"),ne,Mt(ne,d("k"))),d("k"))))}
<p>For a 6-day period ${m(d("\u03C6"),U("\u2248"),C("0.92"))}, so the naive chain overshoots by about 9%. The person-time factor ${m(d("\u03C6"))} is the expected fraction of a day that a person infectious at its start remains infectious. The engine weights each resident infective by it, ${m(d("\u03BB"),V,ye,ee(d("\u03C6"),we,ue,d("V")),he,Ie)}, so each case generates ${m(ye,d("\u03C6"),he,ee(C("1"),ne,Mt(ne,d("k"))),V,ye,he,d("k"))} infections and the daily chain reproduces ${m(ge,V,ye,he,Je)}, the herd-immunity threshold and the Kermack\u2013McKendrick final size exactly. Each country uses its own current ${m(d("k"),V,pe(qe),ue,pe(Pe))}. Exported travelers carry the origin's ${m(d("\u03C6"))} (the expected visitor count is already in infectious person-days), and the reservoir's shedding input is ${m(d("\u03C6"),we)}, so ${m(d("\u03C6"))} is applied once per infectious person-day.</p>
<h3>Metapopulation R0</h3>
<p>With travel, ${m(ge,V,d("\u03C1"),ee(d("K")))}, the spectral radius of the next-generation matrix (Diekmann, Heesterbeek and Metz 1990; van den Driessche and Watmough 2002), where ${m(le(d("K"),Q(d("i"),d("j"))))} counts infections in patch ${m(d("i"))} caused by one infectious resident of ${m(d("j"))}. For the visitor coupling (see Travel)</p>
${ze(Q(le(d("K"),Q(d("j"),d("j"))),V,He(gn(ye),Q(gn(qe),ue,gn(Pe)))),Q(le(d("K"),Q(d("i"),d("j"))),V,He(Q(pe(ye),U("\xB7"),le(d("F"),Q(d("j"),d("i"))),d("T")),Q(gn(Ie),ee(gn(qe),ue,gn(Pe))))))}
<p>with ${m(le(d("F"),Q(d("j"),d("i"))))} daily trips from ${m(d("j"))} to ${m(d("i"))} after channel multipliers and the reduction in travel by the sick, and ${m(d("T"),V,se(oe("travelDays")))} infectious days abroad per trip. Entries use each country's ${m(ye)} with country factors and ${m(Pe)} adjusted for health capacity, without interventions or overload. The engine finds ${m(d("\u03C1"))} by power iteration on ${m(d("K"),ue,d("I"))}; scaling columns by susceptible fractions gives a global ${m(Gt)}.</p>
${Lt("r0-threshold")}`);Zt("curves","Reading epidemic curves",`<p>An epidemic curve shows how many people are in each group over time. The infected curve rises, peaks and falls. It falls because infected people meet fewer and fewer people who can still catch it.</p>
${Lt("curves")}
${yn("Try it.","Drag R0 below 1 and watch the infected curve stay flat. Raise it past 1 and a peak appears. Compare the measles and seasonal flu presets.")}
<p><strong>Flattening the curve</strong> means lowering the peak. Fewer close contacts slow the spread, so fewer people are ill at once and hospitals can cope. In the game, as in reality, more infected people die when hospitals are overwhelmed.</p>
<p><strong>Herd immunity</strong> is reached when so many people are immune that each case infects fewer than one other on average. The higher R0 is, the larger that immune share must be.</p>
${Lt("herd")}
<p>An uncontrolled epidemic overshoots this level, because many people are still infected when it is passed and they infect others on the way down. Vaccination reaches the level without the overshoot.</p>`,`<h3>Growth, peak and herd immunity</h3>
<p>Early on, ${m(We,U("\u2248"),Ie)}, the ${m(we)} equation is linear and ${m(we)} grows exponentially.</p>
${ze(Q(d("r"),V,ye,ne,Je,V,Je,ee(ge,ne,C("1"))),Q(le(d("T"),d("d")),V,He(Q(d("ln"),C("2")),d("r"))))}
<p>In words: the infected count doubles every ${m(le(d("T"),d("d")))} days. Equal ${m(ge)} values can grow at very different speeds if infectious periods differ.</p>
<p>The infected count peaks when ${m(Gt,V,C("1"))}, that is when ${m(We,he,Ie,V,C("1"),he,ge)}. The immune share needed to prevent growth is the <strong>herd-immunity threshold</strong></p>
${ze(Q(le(d("p"),d("c")),V,C("1"),ne,He(C("1"),ge)))}
<p>In words: once more than this fraction is immune, each case infects fewer than one other. Vaccinating a fraction ${m(d("p"))} beforehand gives a starting reproduction number ${m(ge,ee(C("1"),ne,d("p")))}. The peak height is approximately ${m(le(we,re("max")),he,Ie,U("\u2248"),C("1"),ne,ee(C("1"),ue,d("ln"),ge),he,ge)}.</p>
${Lt("herd")}
<p>Let ${m(d("z"))} be the fraction ever infected in an uncontrolled epidemic started by a few cases. Dividing the ${m(We)} equation by the removal equation and integrating gives the <strong>final-size relation</strong></p>
${ze(Q(d("z"),V,C("1"),ne,Mt(ne,ge,d("z"))))}
<p>In words: the chance of escaping infection, ${m(C("1"),ne,d("z"))}, equals the chance of escaping all the infection pressure the epidemic generates. A positive solution exists only for ${m(ge,U("&gt;"),C("1"))}, and it always exceeds ${m(le(d("p"),d("c")))}. That gap is the overshoot. The relation is exact for SIR and a close approximation here while deaths are a small share of the population.</p>
${Lt("curves")}
${yn("Try it.",'Pick a preset and compare "Ever infected" with the herd-immunity threshold. On the log scale the early infected curve is a straight line whose slope is the growth rate. Raise "Vaccinated at day 0" until R at day 0 drops below 1.')}
<h3>A worked example</h3>
<p>Take 10 million people, ${m(ge,V,C("2.3"))}, a 6-day infectious period and an IFR of 0.2%. These values resemble a fast, influenza-like virus.</p>
<ul>
<li>${m(bn,V,C("1"),he,C("6"),U("\u2248"),C("0.167"))} per day, so ${m(Pe,U("\u2248"),C("0.002"),fa,C("0.167"),U("\u2248"),C("0.00033"))} and ${m(qe,U("\u2248"),C("0.166"))} per day; ${m(ye,V,C("2.3"),fa,C("0.167"),U("\u2248"),C("0.383"))} per day.</li>
<li>${m(d("r"),U("\u2248"),C("0.217"))} per day, so the doubling time is about 3.2 days.</li>
<li>Herd-immunity threshold ${m(C("1"),ne,C("1"),he,C("2.3"),U("\u2248"),C("57"),U("%"))}; final size ${m(d("z"),U("\u2248"),C("0.86"))}, about 8.6 million infections and 17,000 deaths.</li>
<li>Peak about 20% infected at once, roughly 2 million people, near day 78 when starting from 8 cases.</li>
</ul>`,`<p>For the deterministic single patch with a vanishing seed: growth rate ${m(d("r"),V,Je,ee(ge,ne,C("1")))}; peak at ${m(We,he,Ie,V,C("1"),he,ge)} with ${m(le(we,re("max")),he,Ie,U("\u2248"),C("1"),ne,ee(C("1"),ue,d("ln"),ge),he,ge)}; herd-immunity threshold ${m(C("1"),ne,C("1"),he,ge)}; and final size</p>
${ze(Q(d("z"),V,le(d("s"),C("0")),ee(C("1"),ne,Mt(ne,ge,d("z")))))}
<p>with ${m(le(d("s"),C("0")))} the initially susceptible fraction (Kermack and McKendrick 1927), solved in the engine by Newton iteration. It assumes a closed population, homogeneous mixing, constant parameters, permanent immunity and a vanishing seed, and it holds for any infectious-period distribution with the same mean. With frequency dependence and disease deaths, ${m(Ie)} falls during the epidemic, so the relation slightly underestimates ${m(d("z"))} unless ${m(re("IFR"),U("\xB7"),d("z"))} is small. Because of the person-time factor, the daily chain satisfies the same relation with the same ${m(ge)}.</p>
${Lt("curves")}
${yn("Try it.","At R0 about 1.2 with few initial cases, the stochastic runs scatter widely and many go extinct. At large population and R0 above 2 they collapse onto the mean.")}
${Lt("herd")}`);Zt("chance","Chance and small numbers",`<p>With millions of cases, chance averages out and the curves are smooth. With a handful of cases, luck matters. An infected person may happen to infect nobody, and the outbreak ends there.</p>
${Lt("stochastic")}
${yn("Try it.",'Set R0 to 2 and press "Run again" a few times. About half of the runs die out early. At R0 = 4 most of them take off.')}
<p>Each game starts with a small cluster of cases, so the epidemic nearly always takes hold. Chance still decides when each new country is reached.</p>
<p>In some real infections a few people cause most of the spread. This is called <strong>superspreading</strong>. The game leaves it out.</p>`,`<p>The differential equations describe averages. When numbers are small, chance in who meets whom matters, and a <strong>stochastic</strong> model, one that draws random numbers, behaves differently from the average. In the game each susceptible person is infected on a given day with probability ${m(C("1"),ne,Mt(ne,d("\u03BB")))}, and each infected person leaves ${m(we)} with probability ${m(C("1"),ne,Mt(ne,Je))}. Totals are binomial draws, so they are whole numbers that differ from run to run.</p>
<p>Early in an outbreak each case acts independently, so the chain of infections is a <strong>branching process</strong>. For this model the number infected by one case is geometric with mean ${m(ge)}, and one case's chain dies out with probability</p>
${ze(Q(d("q"),V,He(C("1"),ge),Yn(),re("(when "),ge,U("&gt;"),C("1"),re(")")))}
<p>In words: at ${m(ge,V,C("2"))} half of all single introductions fizzle out. From ${m(d("k"))} independent cases the chance is ${m(Ct(d("q"),d("k")))}. The game starts with ${de(oe("seedInfected"))} cases, so at ${m(ge,V,C("2.3"))} early extinction has a probability of about ${m(Ct(ee(C("1"),he,C("2.3")),se(oe("seedInfected"))),U("\u2248"),C(de(+((1/2.3)**oe("seedInfected")*100).toPrecision(1))),U("%"))}.</p>
${Lt("stochastic")}
${yn("Try it.","Count the runs that die out at R0 = 2 and compare with the 50% predicted. Then try R0 = 1.2.")}
<p>A caveat on <strong>superspreading</strong>. In many real infections the number infected per case varies far more than a geometric distribution allows, with a few people causing most transmission (Lloyd-Smith and colleagues, 2005). Extinction is then more likely and surviving outbreaks are more erratic. The game leaves this out.</p>`,`<p>The chain is ${m(d("X"),U("\u223C"),re("Bin"),ee(We,U(","),C("1"),ne,Mt(ne,d("\u03BB"))))}, ${m(d("Y"),U("\u223C"),re("Bin"),ee(we,U(","),C("1"),ne,Mt(ne,d("k"))))}, ${m(d("Z"),U("\u223C"),re("Bin"),ee(d("Y"),U(","),Pe,he,d("k")))}. This is a Reed\u2013Frost-type chain-binomial with competing risks. Samplers are exact for small counts (Bernoulli trials for ${m(d("n"),U("&lt;"),C("25"))}, inversion for ${m(d("n"),d("p"),U("&lt;"),C("25"))}) and continuity-corrected normal otherwise, clamped to ${m(U("["),C("0"),U(","),d("n"),U("]"))}, so counts stay integer and conserved.</p>
<p>Near the disease-free state infections form a Galton\u2013Watson process; the extinction probability of one lineage is the smallest root of ${m(d("q"),V,d("G"),ee(d("q")))} for offspring generating function ${m(d("G"))}. In continuous time with exponential infectious periods the offspring distribution is geometric with mean ${m(ge)}, so ${m(d("q"),V,C("1"),he,ge)}, or ${m(Ct(d("q"),d("k")))} for ${m(d("k"))} seeds. The daily chain's offspring distribution differs slightly in shape, so its root is close to ${m(C("1"),he,ge)} without being equal to it. The game's ${de(oe("seedInfected"))} seeds make fade-out of the index cluster negligible for ${m(ge,U("\u2273"),C("2"))}.</p>
${Lt("stochastic")}
<p>Geometric offspring is negative binomial with dispersion ${m(d("k"),V,C("1"))}. Many infections show ${m(d("k"),U("\u226A"),C("1"))} (Lloyd-Smith et al. 2005), which raises extinction probability at fixed ${m(ge)} and makes surviving outbreaks more explosive. The model has no individual heterogeneity in infectiousness and understates both effects.</p>`);Zt("travel","Travel between countries",`<p>Each country in the game has its own epidemic. Countries are linked by travel over land, by air and by sea, and an infected traveler can start a new outbreak.</p>
${Lt("metapop")}
${yn("Try it.","Lower the mobility slider. The outbreak reaches the other towns later. Unless travel almost stops, it still arrives.")}
<p>This is why border closures mostly delay an epidemic. Delay buys time for testing, hospitals and research. Some travel always leaks through a closed border, and very ill or frightened people travel less.</p>`,`<p>A model of several linked populations is a <strong>metapopulation</strong> model. Each country ${m(d("i"))} has its own compartments and parameters, and countries interact through travel. Infected visitors ${m(pe(d("V")))} add to the infection pressure where they are:</p>
${ze(Q(pe(d("\u03BB")),V,pe(ye),He(Q(d("\u03C6"),pe(we),ue,pe(d("V"))),pe(Ie))))}
<p>In words: residents are infected by infected residents and by infected visitors. (The factor ${m(d("\u03C6"))}, slightly below 1, is explained under How the game simulates turns and days.) The number of visitors on a day is random, with a mean proportional to the trips from each infected country, the share of travelers there who are infected and the days they stay.</p>
<p>Travel uses three channels. Land links join neighbors. Air and sea routes come from a <strong>gravity model</strong>, in which flows grow with the size of both economies and shrink with distance. Worldwide the game moves about ${Ta(oe("airTripsPerDay"))} air trips, ${Ta(oe("landTripsPerDay"))} land crossings and ${Ta(oe("seaTripsPerDay"))} sea trips per day. A border closure multiplies travel on that channel by ${de(oe("closureLeak"))}.</p>
${Lt("metapop")}
${yn("Try it.","Note the arrival day in town C, then cut mobility tenfold. Each tenfold cut adds a roughly fixed delay, so halving travel buys only a little time.")}`,`<p>The coupling is the standard short-stay visitor formulation (Sattenspiel and Dietz 1995; Balcan et al. 2009). Travelers stay in their home compartments, since time abroad is short relative to the infectious period and flows are small relative to ${m(Ie)}, so coupling enters only through the force of infection</p>
${ze(Q(pe(d("\u03BB")),V,pe(ye),He(Q(pe(d("\u03C6")),pe(we),ue,pe(d("V"))),pe(Ie)),ue,pe(ye),d("\u03B5"),pe(d("W"))))}
<p>with ${m(pe(d("\u03C6")))} the person-time factor of country ${m(d("i"))} (see R0); the reservoir term applies to bacteria. Infectious visitors are ${m(pe(d("V")),U("\u223C"),re("Poisson"))} with mean, by Little's law,</p>
${ze(Q(d("E"),U("["),gn(d("V")),U("]"),V,Bs("\u2211",Q(d("i"),U(","),d("c"))),jo(d("F"),Q(d("i"),d("j")),d("c")),d("T"),pe(d("\u03C6")),He(pe(we),pe(Ie)),pe(d("m")),jo(d("o"),d("i"),d("c")),jo(d("o"),d("j"),d("c")),le(d("\u03BA"),d("c"))))}
<ul>
<li>${m(jo(d("F"),Q(d("i"),d("j")),d("c")))}: trips per day on channel ${m(d("c"))}. Global totals of ${Ta(oe("airTripsPerDay"))} air, ${Ta(oe("landTripsPerDay"))} land and ${Ta(oe("seaTripsPerDay"))} sea trips per day are shared in proportion to route weight, half in each direction. Air and sea weights are ${m(Ct(ee(re("flow"),he,re("max")),C("0.75")))} from a distance-decay gravity model, so flow scales as ${m(Ct(d("w"),C("4/3")))}; land weights are ${m(Us(pe(Ie),gn(Ie)),ee(C("0.5"),ue,C("0.25"),ee(pe(d("w")),ue,gn(d("w")))))} between neighbors, ${m(d("w"))} the wealth index.</li>
<li>${m(d("T"),V,se(oe("travelDays")))} infectious days abroad per trip, weighted by the origin's ${m(pe(d("\u03C6")))}; ${m(pe(d("m")),V,ee(C("1"),ne,se(oe("sickTravel")),U("\xB7"),re("sev")),ee(C("1"),ne,se(oe("panicTravel")),pe(d("P"))))} times the lockdown travel factor (sick and panicking people travel less; traits modify the ${de(oe("sickTravel"))}).</li>
<li>${m(Ct(d("o"),d("c")))}: open fraction at each end, ${de(oe("closureLeak"))} under an enforced closure; ${m(le(d("\u03BA"),d("c")))}: trait channel multipliers times global factors (hyper-connected toggle, travel advisory).</li>
</ul>
${Lt("metapop")}
<p>While the source is small a new country is reached with daily probability ${m(C("1"),ne,Mt(ne,d("E"),U("["),d("V"),U("]")))}, and arrival time is roughly logarithmic in coupling strength. Brockmann and Helbing (2013) show that effective distance on the mobility network organizes arrival times; cutting mobility by a constant factor shifts arrival by a roughly constant delay, which is why travel restrictions delay more than they prevent (Colizza et al. 2006). Displacement from the social layer is a separate explicit transfer of ${m(We)}, ${m(we)} and ${m(at)} between neighbors.</p>`);Zt("seeing","What can be seen: reporting and delays",`<p>Nobody sees the true number of infections. Many mild cases are never tested. The share of infections that gets counted is called <strong>ascertainment</strong>, and reports arrive days after the infection.</p>
${Lt("reporting")}
${yn("Try it.","Lower the ascertainment and lengthen the delay. The reported curve shrinks and shifts to the right. On the log scale, both curves rise at the same rate.")}
<p>The <strong>infection-fatality ratio</strong> is the share of infected people who die. The <strong>case-fatality ratio</strong> is deaths divided by reported cases. Deaths are counted more reliably than mild cases, so the case-fatality ratio usually looks higher than the true risk.</p>
<p>In the game the government player sees only the delayed reports. The pathogen player sees the true numbers.</p>`,`<p>The <strong>ascertainment</strong> ${m(d("a"))} is the probability that an infection is reported. In the game each day's new infections are thinned at random with probability ${m(d("a"))} and published ${de(oe("caseDelay"))} days later. Deaths have a higher ascertainment and a ${de(oe("deathDelay"))}-day delay. Ascertainment rises with symptom severity, health-system strength and surveillance, and it is low before the pathogen has been identified.</p>
${Lt("reporting")}
${ze(Q(re("IFR"),V,He(re("deaths"),re("infections")),V,He(Pe,bn)),Q(re("CFR"),V,He(re("reported deaths"),re("reported cases"))))}
<p>In words: the IFR is the true risk of death for an infected person, and the CFR is what reports show. With death ascertainment ${m(le(d("a"),d("D")))}, the final CFR is about ${m(ee(le(d("a"),d("D")),he,d("a")),U("\xB7"),re("IFR"))}, which in the game overstates the IFR. During fast growth, deaths lag cases, which biases the naive CFR the other way.</p>
<p>To estimate ${m(Gt)}, compare reported cases this week and last: ${m(d("r"),V,d("ln"),ee(le(d("C"),re("now")),he,le(d("C"),re("prev"))),he,C("7"))}. Steady ascertainment cancels in the ratio. With mean generation time ${m(le(d("T"),d("g")),V,C("1"),he,Je)},</p>
${ze(Q(le(Qa(at,U("^")),d("t")),V,C("1"),ue,d("r"),le(d("T"),d("g"))))}
<p>In words: weekly doubling with a 6-day generation time gives ${m(d("r"),U("\u2248"),C("0.099"))} per day and ${m(le(Qa(at,U("^")),d("t")),U("\u2248"),C("1.6"))}. If testing expands quickly, this estimate is too high.</p>
${yn("In the game.",`The government sees reported numbers and this estimate. A field investigation team sent to a region reveals the true numbers of its countries for ${de($i("fieldTeam","intelDays"))} days.`)}`,`<p>Two binomial thinning stages with fixed delays:</p>
${ze(Q(le(d("C"),Q(d("i"),U(","),d("t"),ue,se(oe("caseDelay")))),U("\u223C"),re("Bin"),ee(le(d("X"),Q(d("i"),U(","),d("t"))),U(","),pe(d("a")))),Q(le(d("M"),Q(d("i"),U(","),d("t"),ue,se(oe("deathDelay")))),U("\u223C"),re("Bin"),ee(le(d("Z"),Q(d("i"),U(","),d("t"))),U(","),pe(d("d")))))}
<p>Case and death ascertainment are</p>
${ze(Q(pe(d("a")),V,re("clamp"),ee(ee(se(oe("ascBase")),ue,se(oe("ascSeverity")),U("\xB7"),re("sev"),ue,se(oe("ascHealth")),pe(d("h")),ue,se(et("surveillance","ascertainmentAdd")),U("\xB7"),re("surv")),U("\xB7"),re("vis"),U(","),C("0"),U(","),se(oe("ascMax")))),Q(pe(d("d")),V,re("clamp"),ee(se(oe("deathAscBase")),ue,se(oe("deathAscHealth")),pe(d("h")),ue,C("0.1"),U("\xB7"),re("surv"),U(","),C("0"),U(","),C("0.98"))))}
<p>with sev the severity index, ${m(d("h"))} the health-capacity proxy, surv the surveillance indicator and vis the trait visibility multiplier. Until the pathogen is detected anywhere, ${m(d("a"))} is \xD7${de(oe("ascPreDetection"))} and ${m(d("d"))} \xD7${de(oe("deathAscPreDetection"))}; in a collapsed state both are \xD7${de(oe("ascCollapsed"))}. A country is detected at ${de(oe("detectCases"))} cumulative reported cases or ${de(oe("detectDeaths"))} deaths. There is no delay distribution and no noise beyond thinning.</p>
${Lt("reporting")}
<p>Under fog of war the government's prevalence is the sum of reported cases over the last ${m(d("D"))} days (capped at a 14-day window and scaled), and ${m(Gt)} is estimated from consecutive 7-day windows,</p>
${ze(Q(d("r"),V,He(C("1"),C("7")),d("ln"),He(Q(le(d("C"),re("now")),ue,C("0.5")),Q(le(d("C"),re("prev")),ue,C("0.5"))),U(","),Yn(),le(Qa(at,U("^")),d("t")),V,C("1"),ue,d("r"),le(d("T"),d("g"))))}
<p>with ${m(le(d("T"),d("g")),V,C("1"),he,Je)}, at least 10 reports, clamped to ${m(U("["),C("0"),U(","),C("20"),U("]"))}. This is the Wallinga\u2013Lipsitch (2007) relation ${m(d("R"),V,C("1"),he,d("M"),ee(ne,d("r")))} for an exponential generation interval. It assumes stationary ascertainment and a known generation interval (the game hands the government the true one) and lags by the delay plus half the window. The renewal-equation estimator of Cori et al. (2013), using the full serial-interval distribution, is the standard practical alternative.</p>
<p>The pathogen side sees ${m(pe(Gt),V,pe(ye),ee(C("1"),ue,re("reservoir gain")),pe(We),he,ee(pe(Ie),ee(pe(qe),ue,pe(Pe))))} from current rates. A field team, sent to a region (or to one country with the ${Bi("countryControl")} toggle), gives exact counts for each target country for ${de($i("fieldTeam","intelDays"))} days and reports ${m(re("Bin"),ee(pe(we),U(","),se($i("fieldTeam","caseFinding"))))} cases at once.</p>`);Zt("interventions","How interventions act on the model",`<p>The government does not act country by country. The world is divided into ${Pi()} regions, and each region has one <strong>response level</strong> that applies the same package of measures to every country in it. Each level includes everything in the level below.</p>
<ul>
<li><strong>${ft("monitor")}.</strong> Routine reporting only. It costs nothing.</li>
<li><strong>${ft("alert")}.</strong> Testing, public advice and medical aid in every country of the region, plus vaccination once a vaccine exists. More cases get counted, transmission falls a little and fewer infected people die.</li>
<li><strong>${ft("contain")}.</strong> Airports, ports and land borders close. Travel in and out of the region drops to a trickle.</li>
<li><strong>${ft("lockdown")}.</strong> Stay-at-home orders cut transmission by about ${St(1-et("lockdown","betaMult"))} where people comply, but the economy suffers and unrest builds.</li>
</ul>
<p>Research toward a cure is funded for the whole world at once.</p>
<p>Regional measures are blunt. They are paid for in every country of the region, whether or not the infection has arrived there. Raising the wrong region, or raising a region too early, spends money that is then missing when it is needed.</p>
<p>Measures work only as far as people follow them, and compliance falls when unrest is high.</p>`,`<p>The government acts through <strong>region response levels</strong>. The world is split into ${Pi()} regions. Each has one level, and raising it switches on a fixed bundle of measures in every member country. Each level includes the bundle of the level below. Research is funded globally. Country-by-country measures exist only with the "${Bi("countryControl")}" setting.</p>
<table>
<tr><th>Level</th><th>Adds</th><th>Effect on the model</th></tr>
<tr><td>${ft("monitor")}</td><td>nothing</td><td>baseline parameters</td></tr>
<tr><td>${ft("alert")}</td><td>${Ea(Ca("alert"))}</td><td>ascertainment up; ${m(ye)} \xD7${de(et("awareness","betaMult"))}; treatment lowers ${m(Pe)} and raises ${m(qe)}; ${m(We,U("\u2192"),at)} once a vaccine exists</td></tr>
<tr><td>${ft("contain")}</td><td>${Ea(Ca("contain"))}</td><td>air, sea and land travel in and out \xD7${de(oe("closureLeak"))}</td></tr>
<tr><td>${ft("lockdown")}</td><td>${Ea(Ca("lockdown"))}</td><td>${m(ye)} \xD7${de(et("lockdown","betaMult"))}, travel \xD7${de(et("lockdown","travelMult"))}, output \xD7${de(et("lockdown","outputMult"))}; fatigue and unrest</td></tr>
</table>
<p>Region-wide measures are blunt. Their upkeep is paid in every member country, infected or not, and the government sees only delayed reports when it chooses. A region raised to ${ft("contain")} before the infection arrives pays for closed borders that protect nothing yet. This is where "spending in the wrong place" comes from, and the game counts such spending as wasted.</p>
<h3>What the levels are made of</h3>
<p>Each measure changes one named parameter. Effects on behavior are scaled by <strong>compliance</strong> ${m(d("c"))} between 0 and 1. A policy that multiplies ${m(ye)} by ${m(d("m"))} at full compliance multiplies it by ${m(C("1"),ne,ee(C("1"),ne,d("m")),d("c"))}.</p>
<table>
<tr><th>Policy</th><th>Parameter</th><th>Effect at full compliance</th></tr>
<tr><td>Surveillance and testing</td><td>ascertainment</td><td>+${de(et("surveillance","ascertainmentAdd"))}</td></tr>
<tr><td>Public awareness</td><td>${m(ye)}</td><td>\xD7${de(et("awareness","betaMult"))}</td></tr>
<tr><td>Lockdown</td><td>${m(ye)}, travel, output</td><td>${m(ye)} \xD7${de(et("lockdown","betaMult"))}, travel \xD7${de(et("lockdown","travelMult"))}, output \xD7${de(et("lockdown","outputMult"))}</td></tr>
<tr><td>Close land borders, airports or ports</td><td>mobility, output</td><td>that channel \xD7${de(oe("closureLeak"))}; output falls by up to ${St(Da("closeLand","outputLoss"))} (land), ${St(Da("closeAir","outputLoss"))} (air) or ${St(Da("closeSea","outputLoss"))} (sea), in proportion to how open the country is on that channel</td></tr>
<tr><td>Medical aid</td><td>capacity, ${m(Pe)}, ${m(qe)}</td><td>capacity \xD7${de(et("medicalAid","capacityMult"))}; ${m(Pe)} \xD7${de(1-jn(Ko,"treatMu"))} (virus) or \xD7${de(1-jn(qo,"treatMu"))} (bacterium); ${m(qe)} \xD7${de(1+jn(Ko,"treatGamma"))} or \xD7${de(1+jn(qo,"treatGamma"))}</td></tr>
<tr><td>Vaccinate</td><td>${m(We,U("\u2192"),at)}</td><td>up to ${St(oe("vaccineMaxDaily"))} dosed per day, at most ${St(oe("vaccineEfficacy"))} efficacy</td></tr>
</table>
<p>Read it through ${m(ge,V,ye,he,Je)}. With ${m(ge,V,C("2.3"))}, a fully followed lockdown gives ${m(se(et("lockdown","betaMult")),fa,C("2.3"),U("\u2248"),se(2.3*et("lockdown","betaMult")))}; adding awareness gives about ${de(2.3*et("lockdown","betaMult")*et("awareness","betaMult"))}. At 70% compliance the lockdown factor is ${m(C("1"),ne,se(1-et("lockdown","betaMult")),fa,C("0.7"),U("\u2248"),se(1-.7*(1-et("lockdown","betaMult"))))}, giving ${m(Gt,U("\u2248"),se(2.3*(1-.7*(1-et("lockdown","betaMult")))))}.</p>
<p>Border measures cost more where they stop more traffic. Their daily upkeep grows with the country's openness on that channel (airport strength, port strength or number of land neighbors), and so does the lost trade and tourism.</p>
<p>Raising ${m(qe)} shortens the infectious period and so lowers ${m(ge)}, which is why antibiotics against a bacterium help control spread while supportive care for a virus mainly saves lives. Vaccination lowers ${m(We,he,Ie)} directly. Completed research raises ${m(qe)} and lowers ${m(Pe)} everywhere, scaled by health-system strength, and unlocks vaccination.</p>`,`<p>The control is a region-level response: ${Pi()} regions, each with one level ${m(d("L"),U("\u2208"),U("{"),C("0"),U(","),C("1"),U(","),C("2"),U(","),C("3"),U("}"))} (${ft("monitor")}, ${ft("alert")}, ${ft("contain")}, ${ft("lockdown")}). A level is a nested bundle of per-country measures: ${ft("alert")} adds ${Ea(Ca("alert"))}, ${ft("contain")} adds ${Ea(Ca("contain"))}, and ${ft("lockdown")} adds ${Ea(Ca("lockdown"))}. Setting a level writes that bundle into every member country, and the per-country machinery below supplies effects and upkeep. Research is a single global tier. With the "${Bi("countryControl")}" toggle, per-country measures can be set on top of the region levels. When the reserve cannot cover the day's upkeep, measures lapse that day, most expensive first, and the region drops to the highest level still fully in force. When the vaccine is completed, regions at ${ft("alert")} or above start vaccinating.</p>
<p>The bundles make the control deliberately coarse in space: upkeep scales with every member country's population and income regardless of local prevalence, so the cost of a level is the region's cost, while the benefit accrues only where transmission or importation pressure exists. Mis-targeted or premature levels are recorded as wasted spend.</p>
<h3>What the levels are made of</h3>
<p>Measures act multiplicatively on the day's parameters, scaled by compliance ${m(pe(d("c")),V,pe(d("\u03B8")),ee(C("1"),ne,se(xe("complianceUnrest")),pe(d("U"))))} from the social layer (stability ${m(d("\u03B8"))}, unrest ${m(d("U"))}), halved during riots, \xD70.2 when collapsed, \xD7${de(1-oe("antiVaxShare"))} under the anti-vaccination toggle, times a trait multiplier.</p>
${ze(Q(pe(ye),V,le(ye,C("0")),pe(d("f")),Bs("\u220F",d("p")),ee(C("1"),ne,ee(C("1"),ne,le(d("m"),d("p"))),pe(d("c"))),ee(C("1"),ne,se(oe("panicBeta")),pe(d("P"))),le(d("s"),d("i")),ee(d("t"))))}
<p>Here ${m(pe(d("f")))} is the country factor, ${m(le(d("m"),d("p")))} is ${de(et("awareness","betaMult"))} (awareness) or ${de(et("lockdown","betaMult"))} (lockdown), ${m(pe(d("P")))} is panic and ${m(le(d("s"),d("i")))} the seasonal factor.</p>
<ul>
<li><strong>Surveillance</strong> adds ${de(et("surveillance","ascertainmentAdd"))} to case and 0.1 to death ascertainment, with no direct effect on transmission.</li>
<li><strong>Border closures</strong> set ${m(Ct(d("o"),d("c")))} to ${de(oe("closureLeak"))} at the closing end, for inbound and outbound flows; collapsed states cannot enforce. Their economic cost is per country: output is multiplied by ${m(C("1"),ne,d("\u2113"),U("\xB7"),re("openness"))} with ${m(d("\u2113"))} = ${de(Da("closeLand","outputLoss"))}, ${de(Da("closeAir","outputLoss"))}, ${de(Da("closeSea","outputLoss"))} for land, air and sea, and upkeep by ${m(d("a"),ue,d("b"),U("\xB7"),re("openness"))}, where openness is airport strength, seaport strength or land neighbors/4 (at most 1). Lockdown also scales outbound travel by ${m(C("1"),ne,se(1-et("lockdown","travelMult")),d("c"))}.</li>
</ul>
<p><strong>Medical aid</strong> multiplies capacity by ${de(et("medicalAid","capacityMult"))} and applies treatment.</p>
${ze(Q(qe,U("\u2190"),qe,ee(C("1"),ue,le(d("g"),d("\u03C4")),ee(C("1"),ne,d("\u03C1")))),Q(Pe,U("\u2190"),Pe,ee(C("1"),ne,le(d("m"),d("\u03C4")),ee(C("1"),ne,d("\u03C1")))))}
<p>Here ${m(ee(le(d("g"),d("\u03C4")),U(","),le(d("m"),d("\u03C4"))))} = (${de(jn(Ko,"treatGamma"))}, ${de(jn(Ko,"treatMu"))}) for a virus and (${de(jn(qo,"treatGamma"))}, ${de(jn(qo,"treatMu"))}) for a bacterium, ${m(d("\u03C1"),U("\u2264"),C("0.9"))} trait resistance.</p>
<p><strong>Cure completion</strong> applies ${m(qe,U("\u2190"),qe,ee(C("1"),ue,se(oe("cureGammaBoost")),d("\u03B4")))} and ${m(Pe,U("\u2190"),Pe,ee(C("1"),ne,se(oe("cureMuCut")),d("\u03B4")))} with delivery ${m(d("\u03B4"),V,Us(d("h")))}; unlocks vaccination.</p>
<p><strong>Vaccination</strong> is untargeted and all-or-nothing. Doses go to the not-yet-vaccinated living population, so only the susceptible share is immunized.</p>
${ze(Q(re("doses"),V,U("min"),ee(re("remaining"),U(","),se(oe("vaccineMaxDaily")),Ie,ee(se(oe("vaccineHealthFloor")),ue,se(1-oe("vaccineHealthFloor")),d("h")),ee(C("0.5"),ue,C("0.5"),d("c")))),Q(re("immunized"),U("\u223C"),re("Bin"),ee(We,U(","),He(Q(re("doses"),U("\xB7"),d("e")),re("unvaccinated")))))}
<p>The efficacy is ${m(d("e"),V,U("max"),ee(se(oe("vaccineMinEfficacy")),U(","),se(oe("vaccineEfficacy")),ne,re("escape")))}. The anti-vaccination toggle leaves ${St(oe("antiVaxShare"))} never dosed. Immunized people enter ${m(at)} and wane with it.</p>`);Zt("traits","Pathogen traits and the virulence trade-off",`<p>The pathogen player evolves <strong>traits</strong>. Each trait changes numbers in the model, such as how easily the infection spreads, how long people stay infectious, how deadly it is and how noticeable it is. Traits are game abstractions and describe no real organism.</p>
<p>A deadlier infection does not automatically spread better. People who die stop spreading it. Severe illness keeps people at home and gets noticed, which brings a faster response. This tension is called the <strong>virulence trade-off</strong>.</p>
<p>A virus mutates more often and can weaken vaccines. A bacterium evolves slowly, can survive in the environment and can resist antibiotics.</p>`,`<p>Each trait is a modifier on model parameters. They combine by multiplication (for rates and multipliers) or addition (for probabilities). In terms of the base values for the pathogen:</p>
<ul>
<li><strong>Transmission traits</strong> multiply ${m(ye)}, some only in certain climates or where sanitation is poor, and some multiply travel on one channel.</li>
<li><strong>Duration traits</strong> multiply the infectious period ${m(C("1"),he,Je)}. With ${m(ye)} fixed, ${m(ge)} rises in proportion.</li>
<li><strong>Symptom traits</strong> add to the infection-fatality ratio and to a <strong>severity</strong> index between 0 and 1. Severity raises ascertainment, raises the share of infected people who need hospital care, and reduces travel by sick people.</li>
<li><strong>Ability traits</strong> remove climate penalties, lower visibility, reduce vaccine efficacy or treatment effects, slow research, or add an environmental reservoir (bacterium only).</li>
</ul>
<p>The game sets ${m(bn,V,C("1"),he,d("D"))} from the infectious period ${m(d("D"))} and then splits it using the IFR: ${m(Pe,V,re("IFR"),he,d("D"))}, ${m(qe,V,ee(C("1"),ne,re("IFR")),he,d("D"))}. So a trait that only raises the IFR leaves ${m(ge,V,ye,d("D"))} unchanged.</p>
<p>The <strong>virulence trade-off</strong> enters in three ways. The most lethal trait shortens ${m(d("D"))}, so it lowers ${m(ge)} directly. In each country ${m(Pe)} is raised by a weak health system and by hospital overload while ${m(qe)} stays the same, so ${m(bn)} grows and the infectious period shrinks. And severity speeds up detection, reduces travel, and drives the reported deaths that make people cautious. A pathogen that kills quickly can burn out before it spreads far.</p>`,`<p>Traits are a table of modifiers aggregated per pathogen (<em>pathogen.js</em>): multipliers multiply, additive effects add, and climate adaptations add per climate up to 1. With base profile ${m(ee(le(at,re("ref")),U(","),le(mn,C("0")),U(","),le(re("IFR"),C("0"))))}:</p>
${ze(Q(ye,V,He(le(at,re("ref")),le(mn,C("0"))),U("\u220F"),re("betaMult")),Q(d("D"),V,le(mn,C("0")),U("\u220F"),re("durMult")),Q(re("IFR"),V,re("clamp"),ee(le(re("IFR"),C("0")),ue,U("\u2211"),re("ifrAdd"),U(","),C("0"),U(","),se(oe("ifrMax")))),Q(Pe,V,He(re("IFR"),d("D")),U(","),Yn(),qe,V,He(Q(C("1"),ne,re("IFR")),d("D"))))}
<p>Country-level modifiers (density, urban share, climate penalty partially removed by adaptation traits, a hot-climate multiplier, a rural term ${m(ee(C("1"),ue,d("k"),ee(C("0.5"),ne,re("urban"))))} and a sanitation term ${m(ee(C("1"),ue,d("k"),ee(C("0.5"),ne,re("wealth"))))}) multiply ${m(ye)} per country. In country ${m(d("i"))}, ${m(pe(Pe),V,Pe,ee(se(oe("muHealthBase")),ue,se(oe("muHealthSlope")),ee(C("1"),ne,pe(d("h")))),d("M"),ee(pe(d("L"))))} while ${m(pe(qe),V,qe)} before treatment.</p>
<h3>Virulence trade-off</h3>
<p>Since IFR traits preserve ${m(bn)}, lethality enters ${m(ge)} only through (i) explicit duration effects (the terminal symptom multiplies ${m(d("D"))} by 0.9); (ii) the country-level increase of ${m(Pe)} from weak health systems and overload, which raises ${m(pe(qe),ue,pe(Pe))} and so lowers the local ${m(ge)} and shortens generations; (iii) severity, which raises ascertainment (earlier detection, earlier response), lowers mobility of infectious people and raises hospital demand; and (iv) reported deaths, which drive panic and so lower ${m(ye)} through behavior. This reproduces the qualitative transmission\u2013virulence trade-off of Anderson and May (1991) without assuming a functional form linking ${m(ye)} to ${m(Pe)}.</p>
<h3>Environmental reservoir</h3>
<p>Bacteria carry a reservoir ${m(d("W"))} in the spirit of Code\xE7o's (2001) cholera model, integrated exactly over each day:</p>
${ze(Q(Dt(d("W")),V,d("\u03C3"),He(Q(d("\u03C6"),we),Ie),ne,d("\u03BE"),d("W"),U(","),Yn(),d("\u03BB"),U("+="),ye,d("\u03B5"),d("W")))}
<p>with ${m(d("\u03C3"),V,se(oe("envShed")))}, ${m(d("\u03B5"),V,se(oe("envBase")),ue,re("trait additions"))} and ${m(d("\u03BE"),V,se(oe("envDecayBase")),he,ee(C("1"),ue,d("\u03B5")))} (persistence traits slow decay). At quasi-equilibrium ${m(Ct(d("W"),U("*")),V,d("\u03C3"),ee(we,he,Ie),he,d("\u03BE"))}, so ${m(ye)} is effectively multiplied by ${m(C("1"),ue,d("\u03B5"),d("\u03C3"),he,d("\u03BE"))}; the displayed ${m(ge)} and ${m(Gt)} include this gain. The reservoir lets transmission continue after ${m(we)} falls, and eradication requires the residual reservoir risk to be negligible as well as ${m(we,V,C("0"))}.</p>`);Zt("society","Behavior and the social layer",`<p>People change their behavior during an epidemic. They avoid crowds when deaths are in the news, and they tire of restrictions. Models that ignore this tend to overestimate spread.</p>
<p>Each country in the game tracks three social measures. <strong>Panic</strong> rises with reported deaths and cases and makes people more careful. <strong>Unrest</strong> grows from economic losses, panic, long lockdowns and mass deaths, and it lowers compliance with the rules. <strong>Stability</strong> falls while unrest stays high. A collapsed state loses most of its hospitals, its reporting and its border control, and refugees may carry the infection abroad.</p>
<p>These rules are rough game approximations, much less grounded in data than the infection model.</p>`,`<p>People change their contacts when they perceive risk, and models that include this feedback (Funk, Salath\xE9 and Jansen 2010) show lower peaks, longer epidemics and sometimes several waves.</p>
<p>The game's social layer tracks a few quantities per country, each between 0 and 1, updated daily.</p>
<ul>
<li><strong>Panic</strong> ${m(d("P"))} moves toward a target that grows with the logarithm of last week's reported deaths and cases per million, so each tenfold rise in reported burden adds a similar step (Weber\u2013Fechner-style perception). Global panic and hospital overload add to it. It rises over about ${xe("panicTauUp")} days and fades over about ${xe("panicTauDown")}. It multiplies ${m(ye)} by ${m(C("1"),ne,se(oe("panicBeta")),d("P"))} and reduces travel.</li>
<li><strong>Unrest</strong> follows lost economic output, panic, lockdown fatigue, recent deaths, overload and war, over about ${xe("unrestTau")} days. A riot releases some of it.</li>
<li><strong>Stability</strong> falls while unrest exceeds a critical level, which is higher in wealthier countries.</li>
</ul>
<p>The layer acts on the epidemic only through parameters. Compliance falls with unrest and instability, and riots halve it. A collapsed state keeps ${St(oe("collapseCapacity"))} of its hospital capacity and reporting and cannot enforce border closures. Wars add deaths, and refugees carry infection to neighbors. These parameters were chosen for plausible game behavior and are not estimated from data.</p>`,`<p>Behavior is the largest source of structural uncertainty in epidemic forecasting (Funk, Salath\xE9 and Jansen 2010). Here risk perception acts on ${m(ye)}, travel and compliance, and it is driven by public reports, never by hidden truth.</p>
<p>Per country, integrated with daily Euler steps:</p>
${ze(Q(Ct(d("P"),U("*")),V,se(xe("panicWDeath")),d("g"),ee(le(d("d"),C("7")),U(";"),se(xe("panicDeathRef")),U(","),se(xe("panicDeathDecades"))),U("+")),Q(U("+"),se(xe("panicWCase")),d("g"),ee(le(d("c"),C("7")),U(";"),se(xe("panicCaseRef")),U(","),se(xe("panicCaseDecades"))),U("+")),Q(U("+"),se(xe("panicWGlobal")),Qa(d("P"),U("\u203E")),ue,se(xe("panicWOverwhelm")),U("\xB7"),re("over")),Q(d("g"),ee(d("x"),U(";"),d("s"),U(","),d("\u039B")),V,U("min"),ee(C("1"),U(","),He(Q(le(d("log"),C("10")),ee(C("1"),ue,d("x"),he,d("s"))),d("\u039B")))),Q(Dt(d("P")),V,He(Q(Ct(d("P"),U("*")),ne,d("P")),d("\u03C4")),U(","),Yn(),d("\u03C4"),V,se(xe("panicTauUp")),re("\xA0rising,\xA0"),se(xe("panicTauDown")),re("\xA0falling")),Q(Ct(d("U"),U("*")),V,se(xe("unrestPanic")),d("P"),ue,se(xe("unrestFatigue")),d("F"),ue,se(xe("unrestEcon")),ee(C("1"),ne,d("y")),U("+")),Q(U("+"),se(xe("unrestOverwhelm")),U("\xB7"),re("over"),ue,se(xe("unrestWar")),U("\xB7"),re("war"),U("+")),Q(U("+"),se(xe("unrestMortality")),U("min"),ee(C("1"),U(","),le(d("M"),C("30")))),Q(Dt(d("U")),V,He(Q(Ct(d("U"),U("*")),ne,d("U")),se(xe("unrestTau")))),Q(Dt(d("\u03B8")),V,ne,se(xe("stabFall")),ee(d("U"),ne,le(d("U"),d("c"))),re("\xA0if\xA0"),d("U"),U("&gt;"),le(d("U"),d("c"))),Q(Dt(d("\u03B8")),V,se(xe("stabRecover")),ee(C("1"),ne,d("\u03B8")),re("\xA0otherwise\xA0")))}
<p>with ${m(le(d("d"),C("7")))}, ${m(le(d("c"),C("7")))} reported deaths and cases per million over 7 days, ${m(d("g"))} a logarithmic (Weber\u2013Fechner-style) response that starts at the reference level ${m(d("s"))} and saturates after ${m(d("\u039B"))} decades, panic weights summing to ${de(xe("panicWDeath")+xe("panicWCase")+xe("panicWGlobal")+xe("panicWOverwhelm"))}, ${m(Qa(d("P"),U("\u203E")))} the population-weighted global panic, ${m(le(d("M"),C("30")))} reported disease deaths over 30 days as a percentage of the population, "over" a detected hospital overload, ${m(d("F"))} lockdown fatigue (${m(d("F"),U("\u2190"),d("F"),ue,ee(C("1"),ne,d("F")),he,se(1/xe("fatigueRise")))} per locked-down day, ${m(d("F"),U("\u2190"),d("F"),ee(C("1"),ne,C("1"),he,se(1/xe("fatigueDecay"))))} otherwise), ${m(d("y"))} economic output relative to baseline, ${m(le(d("U"),d("c")),V,se(xe("stabCritBase")),ue,se(xe("stabCritWealth")),U("\xB7"),re("wealth"))} and stability ${m(d("\u03B8"))}; all quantities are clamped to ${m(U("["),C("0"),U(","),C("1"),U("]"))}. Discrete events are Bernoulli hazards: riots at ${de(xe("riotProb"))} per day while ${m(d("U"),U("&gt;"),se(xe("riotLevel")))}, each lasting 14 days and discharging ${de(xe("riotVent"))} of unrest and fatigue; collapse when ${m(d("\u03B8"),U("&lt;"),se(xe("collapseLevel")))} (recovery above ${de(xe("recoverLevel"))}); war between land neighbors both below ${m(d("\u03B8"),V,se(xe("warStability")))} at ${de(xe("warProb"))} per pair per day, ending at ${de(xe("warEndProb"))} per day or on recovery; conflict deaths at a daily probability of ${de(xe("warDeathRate"))} per person in each living compartment; displacement of a daily share ${de(xe("refugeeRate"))} of each living compartment to the most stable non-collapsed neighbor.</p>
<p>The coupling to the epidemic is through ${m(ye)} (panic), mobility (panic, displacement), compliance ${m(d("c"),V,d("\u03B8"),ee(C("1"),ne,se(xe("complianceUnrest")),d("U")))}, severe-care capacity (\xD7${de(oe("collapseCapacity"))} when collapsed, \xD7${de(oe("warCapacity"))} at war), ascertainment (\xD7${de(oe("ascCollapsed"))} when collapsed) and border enforcement. Global order collapses, ending the game, when ${St(oe("collapseWinFrac"))} of the world's population lives in collapsed states. None of these constants is estimated; they are design choices that produce plausible fast-up, slow-down risk perception and a delayed, cumulative political cost of restrictions.</p>`);Zt("how-the-game-simulates","How the game simulates turns and days",`<p>The game is played in turns. In each turn the pathogen player moves first and chooses which traits to evolve. Then the government player sets each region's response level and the research budget. Then a block of days is simulated with no further input: ${Ii()}.</p>
<p>Each simulated day, in this order:</p>
<ol>
<li>Travelers carry infection between countries.</li>
<li>In each country, some people are infected and some infected people recover or die.</li>
<li>If a vaccine exists, vaccination protects more people.</li>
<li>New cases and deaths enter the reporting system.</li>
<li>Panic, unrest and stability update.</li>
<li>The pathogen earns points, and the government pays for its measures while research advances. Measures it can no longer afford lapse.</li>
<li>The game checks for a winner.</li>
</ol>
<p>Decisions made in a turn hold for the whole block of days that follows. Many steps involve chance, like rolling dice for each person. The dice come from a number called the <strong>seed</strong>, so the same seed and the same choices always give the same game.</p>`,`<p>The game is turn-based. Each turn the pathogen side moves (evolving or dropping traits), then the government side (region response levels, research funding, one-off operations), then a block of days is simulated day by day with no input: ${Ii()}. The model underneath is still a daily stochastic SIRD model. In each country, each day:</p>
<ol>
<li>The expected number of infected visitors is computed and the actual number drawn at random.</li>
<li>Today's ${m(ye)}, ${m(qe)}, ${m(Pe)} and ascertainment are computed from traits, country properties, policies, panic, compliance, season (optional) and hospital load.</li>
<li>Each susceptible person is infected with probability ${m(C("1"),ne,Mt(ne,d("\u03BB")))}, ${m(d("\u03BB"),V,ye,ee(d("\u03C6"),we,ue,d("V")),he,Ie)}. The factor ${m(d("\u03C6"))}, slightly below 1, corrects for infected people who recover or die partway through the day, so that the daily steps reproduce ${m(ge,V,ye,he,Je)} exactly.</li>
<li>Each infected person leaves ${m(we)} with probability ${m(C("1"),ne,Mt(ne,Je))}; a fraction ${m(Pe,he,Je)} of them die.</li>
<li>Optional waning, then vaccination.</li>
<li>A random share of today's infections and deaths enters the reporting pipeline.</li>
</ol>
<p>Then the social layer updates, the pathogen earns points and may gain a random symptom, the government's budget and research update, and win conditions are checked. The pathogen wins by reaching its death target, by collapsing states holding ${St(oe("collapseWinFrac"))} of humanity or by bankrupting the response; the government wins by eradicating the infection or by keeping it contained after the cure for ${de(oe("containedDays"))} days. Decisions are made only at turn boundaries, so a choice holds for the whole block of days. Within a block, unaffordable measures lapse automatically and a region drops to the highest level it can still pay for. </p>
<p>All randomness comes from a generator started from the <strong>seed</strong>, so the same seed, world and actions reproduce the same game exactly. News uses a separate random stream, so headlines never change the epidemic.</p>`,`<p>Play alternates in turns (<em>playTurn()</em>). The pathogen side acts, then the government side (region levels, research tier, operations), then <em>step()</em> runs once per day for ${Ii()}, stopping early if the game ends. Rates stay daily; only decisions are per turn.</p>
<p>One call of <em>step()</em> does, in order:</p>
<ol>
<li><strong>Epidemic.</strong> Compliance, outbound travel and channel open fractions for every country; expected visitors ${m(d("E"),U("["),gn(d("V")),U("]"))}; then, for each country that can change today, rates from the start-of-day state, the exact one-day reservoir update, ${m(pe(d("V")))} drawn, ${m(d("X"))}, ${m(d("Y"))} (on the start-of-day ${m(we)}) and ${m(d("Z"))} drawn, new infections added to ${m(we)}, waning ${m(re("Bin"),ee(at,U(","),C("1"),ne,Mt(ne,d("\u03C9"))))}, vaccination, reporting pipelines, detection and clearance, and overload events with hysteresis (above ${m(d("L"),V,C("1"))}, cleared below 0.8).</li>
<li><strong>Society</strong>: panic, fatigue, unrest, stability, riots, collapse, war, displacement.</li>
<li><strong>Pathogen</strong>: points and random mutation with daily probability ${m(re("rate"),fa,U("min"),ee(C("1"),U(","),le(d("log"),C("10")),ee(C("1"),ue,we),he,C("8")))}.</li>
<li><strong>Government</strong>: output index, income, lapses, payments, research. Regions whose measures lapsed then drop to the highest level still in force, and on the day the vaccine is completed, regions at ${ft("alert")} or above start vaccinating.</li>
<li>Public milestones from reports, end conditions, history, news.</li>
</ol>
<p>Coarse decision intervals matter in a control problem with delayed, partial observation. A decision taken at the start of a turn uses reports that lag infection by the reporting delay, and it then stands for a whole turn, so the information behind it is up to ${de(Math.max(...kn.map(e=>e.roundDays))+oe("caseDelay"))} days old by the turn's end. Under exponential growth this favors anticipatory, precautionary settings and penalizes waiting for unambiguous data.</p>
<h3>Capacity-dependent mortality</h3>
<p>Severe-care capacity is ${m(pe(Ie),ee(se(oe("bedsBase")),ue,se(oe("bedsHealth")),pe(d("h"))),he,C("1000"))} (beds range from about 0.5 to 13 per 1000), demand ${m(we,ee(se(oe("severeBase")),ue,se(oe("severeSlope")),U("\xB7"),re("sev")))} and load ${m(d("L"))} their ratio. Above ${m(d("L"),V,C("0.2"))}, ${m(Pe)} is multiplied by</p>
${ze(Q(d("M"),ee(d("L")),V,C("1"),ue,se(oe("overloadMuMax")),He(d("x"),Q(C("1"),ue,d("x")))),Q(d("x"),V,He(Q(d("ln"),ee(C("1"),ue,Mt(se(oe("overloadSharpness")),ee(d("L"),ne,C("1"))))),se(oe("overloadSharpness")))))}
<p>a smooth rise toward ${de(1+oe("overloadMuMax"))} times the base value once demand exceeds capacity.</p>
<h3>Seasonality and waning</h3>
<p>Optionally ${m(ye)} is multiplied by ${m(C("1"),ue,d("A"),d("cos"),ee(C("2"),d("\u03C0"),ee(d("t"),ne,le(d("t"),re("peak"))),he,C("365")))} with ${m(d("A"),V,se(oe("seasonAmp")))} (\xD7${de(oe("seasonTropicsDamp"))} in the tropics), a mid-January northern peak, a southern peak half a year later and a random calendar start. Optional waning uses ${m(d("\u03C9"),V,C("1"),he,se(1/oe("waningRate")))} per day, allowing endemic dynamics and recurrent waves.</p>
<h3>End conditions</h3>
<p>Checked after each day, in this order. The pathogen wins when true disease deaths reach the kill target (a share of humanity set per game length, currently ${Pl()}, or everyone with the extinction toggle); when ${St(oe("collapseWinFrac"))} of the world's population lives in collapsed states; or when the response is bankrupt, meaning its reserve has stayed below ${St(oe("bankruptFloor"))} of the starting budget for ${de(oe("bankruptDays"))} days while true prevalence exceeds ${St(oe("bankruptUncontrolled"))}. The government wins when the cure exists and true prevalence has stayed below ${St(oe("containedPrevalence"))} for ${de(oe("containedDays"))} days (contained), or when no infections remain and the reservoir risk is negligible (eradicated). At ${de(oe("hardCapMult"))} times the length's target duration the game is decided on score.</p>
${yn("Randomness.","Random quantities are importations, infections, removals and the death split, waning, vaccinations, report thinning, riots, wars, conflict deaths, displacement, random mutations, the field team's case finding, the calendar start day and, with random start, the first country. The generator is sfc32 seeded through splitmix32 from the seed, with its state in the save file. News uses a second stream, and the AI uses stateless hashes of public information, so neither perturbs the simulation.")}`);Zt("limits","What the model leaves out",`<p>The model leaves out a great deal. Everyone in a country mixes equally. There is no incubation period. Age does not change the risk of dying. Hospital capacity and travel routes are estimated from income, population and distance. The government's measures apply to whole regions at once, which real health authorities would not do. Many numbers were chosen to make a good game.</p>
<p>Real forecasting is harder still, because behavior, variants and data all keep changing. Use the game to understand how epidemics work. Its numbers say nothing reliable about any real outbreak.</p>`,`<p>The main simplifications, and what each changes:</p>
<ul>
<li><strong>No incubation period.</strong> An SEIR model adds a latent class. Without it, early growth is faster for a given ${m(ge)}.</li>
<li><strong>Homogeneous mixing.</strong> Real contacts cluster in households, schools and workplaces, which usually slows spread.</li>
<li><strong>No age structure.</strong> Real death risk rises steeply with age.</li>
<li><strong>Exponential infectious periods.</strong> A constant daily chance of recovery makes some people infectious far longer than real infections allow.</li>
<li><strong>Proxy data.</strong> Health capacity is estimated from GDP per person, travel routes from a gravity model; urban shares are approximate and some GDP figures are several years old.</li>
<li><strong>Regional uniformity.</strong> Measures are set for whole regions in fixed bundles, and decisions come once per turn. Real responses are local, graded and continuous.</li>
<li><strong>Game balance.</strong> Points, budgets, costs, research speed and the social layer were tuned for play.</li>
</ul>
<p>This game shows mechanisms. It is not a forecasting tool.</p>`,`<p>Roughly in order of quantitative importance:</p>
<ul>
