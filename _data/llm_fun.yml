# One entry per item on the LLM-fun page (/llm-fun/), newest first.
# To add one: put its files in llm-fun/<slug>/ (an index.html there is served as is),
# then add an entry here.
# url: a path in this repo (e.g. /llm-fun/r-naught/) or a full URL.
# image: a path in this repo or a full URL. If it fails to load, the card shows the name instead.

- slug: r-naught
  name: R-Naught
  kind: Game
  date: 2026-11-11
  url: /llm-fun/r-naught/
  blurb: >-
    A turn-based pandemic strategy game on a stochastic SIRD model of 171 countries.
    Play the pathogen or the world's response, against the computer or a friend on the
    same device. Its Learn mode explains compartmental models and R0 at three levels.
  made: Built by Claude agents under my direction.
  tags: [Stochastic SIRD, Metapopulation model, Turn-based, Claude]
  image: /images/llm-fun/r-naught.jpg
  image_alt: A world map coloured by infection level, with a turn report and an End turn button

- slug: thornwick-vale
  name: Thornwick Vale
  kind: Game
  date: 2026-10-16
  url: /llm-fun/thornwick-vale/
  blurb: >-
    A classic-style fantasy adventure that runs in one browser page. Pick one of seven
    classes, level from 1 to 40 across five zones with a party of AI companions, and clear
    five dungeons. Every character has written dialogue. Saves stay in your browser.
  made: Built by Claude agents under my direction.
  tags: [Fantasy RPG, Single page, Written dialogue, Claude]
  image: /images/llm-fun/thornwick-vale.jpg
  image_alt: The Thornwick Vale title screen, with class choices over a village scene
