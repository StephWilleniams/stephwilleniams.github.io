# One entry per item on the LLM-fun page (/llm-fun/), newest first.
# To add one: put its files in llm-fun/<slug>/ (an index.html there is served as is),
# then add an entry here.
# involvement: one or two sentences on how hands-on you were (optional; shown as "My involvement").
# made: one line on how it was built (optional).
# url: a path in this repo (e.g. /llm-fun/r-naught/, or a PDF in llm-fun/<slug>/) or a full URL.
# image: a path in this repo or a full URL. If it fails to load, the card shows the name instead.

- slug: r-naught
  name: R-Naught
  kind: Game
  date: 2026-11-11
  url: /llm-fun/r-naught/
  blurb: >-
    A turn-based pandemic strategy game on a stochastic SIRD model of 171 countries.
    Play the pathogen or the world's response, against the computer or a friend on the
    same device. Its Learn mode explains compartmental models and R0 at three levels.
  involvement: >-
    Light-touch direction. I wrote the brief and steered the design from my phone as it came
    together, asking for clearer aims, region-level controls and turn-based play. It was
    designed as a turn-based game for an educational date night.
  made: Built by Claude agents in one day, November 2026.
  tags: [Stochastic SIRD, Metapopulation model, Turn-based, Claude]
  image: /images/llm-fun/r-naught.jpg
  image_alt: A world map coloured by infection level, with a turn report and an End turn button

- slug: unwalled-garden
  name: The Unwalled Garden
  kind: Book
  date: 2026-10-19
  url: /llm-fun/unwalled-garden/The-Unwalled-Garden.pdf
  blurb: >-
    A popular history of interdisciplinary research: the book I always wanted to write but, as
    a postdoc, am very much too busy for. From what I have read so far it is an amusing book,
    albeit very boringly phrased (it's written in claudish!).
  involvement: >-
    Light-touch. I passed drafts back and forth between Gemini Argon 4 and Fable 5.1 a few
    times to put it together, and helped along the way. It falls under my 'need to intensely
    verify' category, so I shan't vouch for the book's factual correctness (perhaps some time
    I will check it all)!
  made: 'A 294-page manuscript draft (PDF): "How the Collision of Disciplines Shaped Modern Discovery".'
  tags: [Popular history, Interdisciplinary research, Gemini, Claude]
  image: /images/llm-fun/unwalled-garden.jpg
  image_alt: The title page of The Unwalled Garden, a manuscript draft

- slug: thornwick-vale
  name: Thornwick Vale
  kind: Game
  date: 2026-10-16
  url: /llm-fun/thornwick-vale/
  blurb: >-
    A classic-style fantasy adventure that runs in one browser page. Pick one of seven
    classes, level from 1 to 40 across five zones with a party of AI companions, and clear
    five dungeons. Every character has written dialogue. Saves stay in your browser.
  involvement: >-
    Medium. I wrote an original design spec, but nothing too specific – motivated to make a
    budget World of Warcraft. I did a bunch of playtesting, checked each part, and I have
    finished the game from start to end (which was surprisingly fun!). The game went through
    maybe 3-5 major versions, including a graphic overhaul, simulated encounter balancing, and
    (the full version, not on the site) full (generated) voice acting and working multiplayer.
  made: About 45,000 lines of JavaScript, built by Claude agents over four days in October 2026.
  tags: [Fantasy RPG, Single page, Written dialogue, Claude]
  image: /images/llm-fun/thornwick-vale.jpg
  image_alt: The Thornwick Vale title screen, with class choices over a village scene
