- slug: chlamydomonas
  name: Chlamydomonas reinhardtii
  common: Swimming microalga
  theme: Active–passive mixtures
  blurb: >-
    My PhD work: how swimming algae push passive particles around under confinement, and how to use
    that to sort them. The physics behind how motile symbionts move near a host's surfaces.
  methods: [Statistical physics, Active particles, Numerical simulation, Image analysis]
  image: https://commons.wikimedia.org/wiki/Special:FilePath/Chlamydomonas_(10000x).jpg?width=900
  image_alt: Electron micrograph of a Chlamydomonas cell with its two flagella
  image_caption: '<em>Chlamydomonas</em>, a single-celled alga that swims with two flagella.'
  image_credit: '"Chlamydomonas (10000x)", via Wikimedia Commons'
  image_credit_url: https://commons.wikimedia.org/wiki/File:Chlamydomonas_(10000x).jpg
