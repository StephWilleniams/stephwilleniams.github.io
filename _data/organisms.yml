# One entry per study system. Used by the research overview page and the homepage tiles.
# To add a system: add an entry here and a page at research/<slug>/index.html.
# image: a path in this repo (e.g. /images/research/x.png) or a full URL. If it fails to load,
# the card shows the organism name instead.

- slug: euprymna-scolopes
  name: Euprymna scolopes
  common: Hawaiian bobtail squid
  theme: How hosts recruit their microbes
  blurb: >-
    Newly hatched squid use breathing and cilia-driven flows to capture their bioluminescent
    bacterial partner from seawater. I model these flows to ask how heat stress changes that recruitment.
  methods: [Computational fluid dynamics, Regularized Stokeslets, Sobol sensitivity analysis, Active Brownian motion]
  image: https://commons.wikimedia.org/wiki/Special:FilePath/Hawaiian_Bobtail_squid.tiff?width=900
  image_alt: A Hawaiian bobtail squid on a dark background
  image_caption: 'The Hawaiian bobtail squid. Its light organ houses the bacterium <em>Vibrio fischeri</em>.'
  image_credit: '"Hawaiian Bobtail squid", via Wikimedia Commons'
  image_credit_url: https://commons.wikimedia.org/wiki/File:Hawaiian_Bobtail_squid.tiff

- slug: vibrio-fischeri
  name: Vibrio fischeri
  common: Bioluminescent bacterial symbiont
  theme: How microbes adapt to stress
  blurb: >-
    Free-living bacteria must balance surviving in the ocean against colonizing a host. I model how
    stress selects for biofilm formation, and design the experiments that can measure it.
  methods: [Trait-structured population models, Natural selection, Identifiability, Genetic algorithms]
  image: /images/research/biofilms.png
  image_alt: Diagram of biofilm formation responding to environmental stressors
  image_caption: 'Biofilm formation responds to abiotic (temperature, pH, oxygen) and biotic (predators, local population) stressors.'
  image_credit: 'Figure: Stephen Williams'
  image_credit_url: ""

- slug: exaiptasia-diaphana
  name: Exaiptasia diaphana
  common: Sea anemone, a model for coral bleaching
  theme: How stressed host populations persist
  blurb: >-
    Exaiptasia hosts the same algae as reef-building corals and bleaches the same way. I build population
    models of how heat stress, and the anemone's microbiome, shape its growth and reproduction.
  methods: [Delay differential equations, Size-structured models, Generalized additive models, Identifiability]
  image: /images/research/exaiptasia.jpg
  image_alt: An Exaiptasia anemone seen from above in a clear container, its long tentacles spread around the mouth
  image_caption: 'An <em>Exaiptasia diaphana</em> anemone, seen from above.'
  image_credit: 'Photo: Sophia MacVittie, Sogin Lab, University of California, Riverside'
  image_credit_url: ""

- slug: cassiopea
  name: Cassiopea
  common: Upside-down jellyfish
  theme: New project
  label: New
  blurb: >-
    Another animal that lives with photosynthetic algae. With Kaden Muffett, I am using deep learning on
    daily photographs to measure when Cassiopea polyps transform into juvenile jellyfish.
  methods: [Deep-learning object detection, Image analysis, Time-series data]
