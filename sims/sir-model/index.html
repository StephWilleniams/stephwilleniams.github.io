<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIR Model · Stephen Williams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16202A; --ink-2: #3D4955; --muted: #5B6672;
      --line: #E3E7EC; --line-2: #C9D1DA; --panel: #F8FAFB; --accent: #0B4F8A;
      --s: #8FB3D9; --i: #D9661F; --r: #0B3A66;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--panel); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .app { display: flex; flex-wrap: wrap; gap: 32px; padding: 24px; }
    .controls { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    .stat .k { font-size: 13px; color: var(--muted); }
    .stat .v { font-size: 22px; font-weight: 500; }
    button {
      align-self: flex-start; min-height: 44px; padding: 0 18px; font: inherit; color: var(--ink);
      background: #fff; border: 1px solid var(--line-2); border-radius: 8px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .plot { flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    svg { width: 100%; height: 260px; background: #fff; border: 1px solid var(--line); border-radius: 8px; display: block; }
    .legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ink-2); }
    .keys { display: flex; flex-wrap: wrap; gap: 16px; }
    .key { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 16px; height: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React from a CDN: no build step needed. For bigger sims, build with Vite and drop the output in a folder like this one. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    var h = React.createElement;
    var useState = React.useState, useMemo = React.useMemo, useEffect = React.useEffect;

    var DAYS = 160, W = 600, H = 260, PAD = 8;

    // Simple SIR model, forward-Euler with 10 sub-steps per day.
    function simulate(beta, gamma) {
      var sub = 10, dt = 1 / sub;
      var S = 0.999, I = 0.001, R = 0, peak = I;
      var s = [], i = [], r = [];
      function y(v) { return (H - PAD - v * (H - 2 * PAD)).toFixed(1); }
      for (var d = 0; d <= DAYS; d++) {
        var x = (d / DAYS * W).toFixed(1);
        s.push(x + ',' + y(S)); i.push(x + ',' + y(I)); r.push(x + ',' + y(R));
        if (I > peak) peak = I;
        for (var k = 0; k < sub; k++) {
          var inf = beta * S * I * dt, rec = gamma * I * dt;
          S -= inf; I += inf - rec; R += rec;
        }
      }
      return { s: s.join(' '), i: i.join(' '), r: r.join(' '), peak: peak };
    }

    function Slider(props) {
      return h('div', { className: 'field' },
        h('label', { htmlFor: props.id },
          h('span', null, props.label),
          h('span', { className: 'mono' }, props.value.toFixed(2))),
        h('input', {
          id: props.id, type: 'range', min: props.min, max: props.max, step: 0.01,
          value: props.value, onChange: function (e) { props.onChange(parseFloat(e.target.value)); }
        }));
    }

    function Line(props) {
      return h('polyline', { points: props.points, fill: 'none', stroke: props.color, strokeWidth: props.width || 2.5, vectorEffect: 'non-scaling-stroke' });
    }

    function App() {
      var b = useState(0.3), beta = b[0], setBeta = b[1];
      var g = useState(0.1), gamma = g[0], setGamma = g[1];
      var sim = useMemo(function () { return simulate(beta, gamma); }, [beta, gamma]);

      return h('div', { className: 'app' },
        h('div', { className: 'controls' },
          h(Slider, { id: 'beta', label: 'Transmission rate β', min: 0.05, max: 0.8, value: beta, onChange: setBeta }),
          h(Slider, { id: 'gamma', label: 'Recovery rate γ', min: 0.02, max: 0.5, value: gamma, onChange: setGamma }),
          h('div', { className: 'stats' },
            h('div', { className: 'stat' }, h('div', { className: 'k' }, 'R₀ = β/γ'), h('div', { className: 'v mono' }, (beta / gamma).toFixed(1))),
            h('div', { className: 'stat' }, h('div', { className: 'k' }, 'Peak infected'), h('div', { className: 'v mono' }, Math.round(sim.peak * 100) + '%'))),
          h('button', { type: 'button', onClick: function () { setBeta(0.3); setGamma(0.1); } }, 'Reset')),
        h('div', { className: 'plot' },
          h('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', role: 'img', 'aria-label': 'Susceptible, infected and recovered fractions over 160 days' },
            [65, 130, 195].map(function (yy) { return h('line', { key: yy, x1: 0, y1: yy, x2: W, y2: yy, stroke: '#EEF1F4', vectorEffect: 'non-scaling-stroke' }); }),
            h(Line, { points: sim.s, color: 'var(--s)' }),
            h(Line, { points: sim.r, color: 'var(--r)' }),
            h(Line, { points: sim.i, color: 'var(--i)', width: 3 })),
          h('div', { className: 'legend' },
            h('div', { className: 'keys' },
              h('span', { className: 'key' }, h('span', { className: 'swatch', style: { background: 'var(--s)' } }), 'Susceptible'),
              h('span', { className: 'key' }, h('span', { className: 'swatch', style: { background: 'var(--i)' } }), 'Infected'),
              h('span', { className: 'key' }, h('span', { className: 'swatch', style: { background: 'var(--r)' } }), 'Recovered')),
            h('span', { className: 'mono', style: { fontSize: 13, color: 'var(--muted)' } }, '0 – 160 days'))));
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));

    // When embedded in an iframe, tell the parent page how tall we are.
    if (window.parent !== window) {
      var report = function () {
        window.parent.postMessage({ type: 'sim-height', height: document.documentElement.scrollHeight }, '*');
      };
      new ResizeObserver(report).observe(document.body);
      window.addEventListener('load', report);
    }
  </script>
</body>
</html>
